site_name: miseenplace
site_description: Every ask, in its place. An agent-native CLI and Agent Skills that turn the asks, promises and nudges in your chat into a triaged inbox and an audit-logged action list.
site_url: https://ankitkpandey1.github.io/miseenplace/
repo_url: https://github.com/ankitkpandey1/miseenplace
repo_name: ankitkpandey1/miseenplace
edit_uri: edit/main/docs/
copyright: Apache-2.0

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate

plugins:
  - search
  - social

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ankitkpandey1/miseenplace

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

exclude_docs: |
  launch.md

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - CLI: cli.md
  - Data model: data-model.md
  - Sources: sources.md
  - Writing a source: writing-a-source.md
  - Writing a storage backend: writing-a-storage-backend.md
  - Agent cost: agent-cost.md
  - Security: security.md
